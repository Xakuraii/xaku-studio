[project]
name = "xakustudio-engine"
version = "0.1.0"
description = "XakuStudio Python 3.12.10 AI Worker Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/python/src/xakustudio"]

[tool.pytest.ini_options]
testpaths = ["engine/python/tests"]
pythonpath = ["engine/python/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine/python/src", "engine/python/tests"]
