name: XakuStudio CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: TypeScript & Vitest & Build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Set up uv & Python 3.12.10
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.10"

      - name: Sync Python engine (CPU/base check)
        run: uv sync --locked --no-install-project

      - name: Python lint & unit/protocol tests
        run: |
          uv run ruff check engine/python
          uv run pytest -v

  rust-core:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Prepare minimal frontend dist for Tauri context
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/dist | Out-Null
          '<!doctype html><html><body></body></html>' | Set-Content -Path apps/desktop/dist/index.html -NoNewline

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - name: Compile Rust targets & run unit tests
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --no-run
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
